[project]
name = "hrp-qwen3-shap-pilot"
version = "0.1.0"
description = "Local Qwen3 explanation-faithfulness pilot with entirely fictional patient data"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "shap>=0.46,<1",
  "matplotlib>=3.8,<4",
  "requests>=2.31,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
